name: Operations / Evidence
on:
  workflow_dispatch:
    inputs:
      soak-profile:
        type: choice
        options: [smoke, stability-2h, overnight-8h]
        default: smoke
      runner:
        type: choice
        options: [github-hosted, self-hosted-x64]
        default: github-hosted
permissions:
  contents: read
jobs:
  cpp-operations:
    uses: HoneyBury/cpp-project-foundation/.github/workflows/reusable-operations.yml@v0.1.1
    with:
      conan-profile: conan/profiles/linux-gcc-x64
      conan-lockfile: conan/locks/linux-gcc-x64-release.lock
      cmake-target: hello_service
      soak-profile: ${{ inputs.soak-profile }}
      runner: ${{ inputs.runner == 'self-hosted-x64' && '["self-hosted","Linux","X64"]' || '["ubuntu-24.04"]' }}
