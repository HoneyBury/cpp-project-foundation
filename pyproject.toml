[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-project-foundation"
version = "0.1.0"
description = "Manifest-driven engineering foundation for production C++ projects"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HoneyBury"}]

[project.scripts]
cpp-foundation = "foundation.cli:main"

[tool.setuptools]
packages = ["foundation"]
