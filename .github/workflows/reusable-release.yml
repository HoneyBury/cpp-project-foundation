name: Reusable / C++ Release

on:
  workflow_call:
    inputs:
      project-directory:
        type: string
        default: "."
      manifest:
        type: string
        default: "foundation.toml"
      conan-profile:
        type: string
        required: true
      conan-lockfile:
        type: string
        required: true
      cmake-target:
        type: string
        required: true
      publish-release:
        type: boolean
        default: true
      enable-attestations:
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cpp-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup foundation CLI
        uses: HoneyBury/cpp-project-foundation/.github/actions/setup-foundation@v0.3.0
      - name: Build release target
        working-directory: ${{ inputs.project-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build
          python3 -m pip install "conan==2.8.1"
          conan remote add conancenter https://center2.conan.io --force
          CC=gcc-13 CXX=g++-13 conan install . \
            --profile:host "${{ inputs.conan-profile }}" \
            --profile:build "${{ inputs.conan-profile }}" \
            --lockfile "${{ inputs.conan-lockfile }}" \
            --output-folder=build/conan --build=missing
          CC=gcc-13 CXX=g++-13 cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake
          cmake --build build/release --parallel --target "${{ inputs.cmake-target }}"
      - name: Package and verify
        id: package
        working-directory: ${{ inputs.project-directory }}
        env:
          FOUNDATION_CANDIDATE_REVISION: ${{ github.sha }}
        run: |
          cpp-foundation --manifest "${{ inputs.manifest }}" package --output-dir dist
          archive=$(find "$PWD/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)
          sbom="$archive-sbom.spdx.json"
          test -f "$archive" && test -f "$sbom"
          cpp-foundation verify-release --archive "$archive" --checksum "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v') && (github.event.repository.visibility == 'public' || inputs.enable-attestations)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Attest SBOM
        if: startsWith(github.ref, 'refs/tags/v') && (github.event.repository.visibility == 'public' || inputs.enable-attestations)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.publish-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ inputs.project-directory }}"/dist/* --verify-tag --generate-notes
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpp-release-${{ github.run_id }}
          path: ${{ inputs.project-directory }}/dist/**
          if-no-files-found: error
