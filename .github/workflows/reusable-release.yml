name: Reusable / C++ Release

on:
  workflow_call:
    inputs:
      project-directory:
        type: string
        default: "."
      manifest:
        type: string
        default: "foundation.toml"
      conan-profile:
        type: string
        required: true
      conan-lockfile:
        type: string
        required: true
      cmake-target:
        type: string
        required: true
      publish-release:
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cpp-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Setup foundation CLI
        uses: HoneyBury/cpp-project-foundation/.github/actions/setup-foundation@v0.1.0
      - name: Build release target
        working-directory: ${{ inputs.project-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build
          python3 -m pip install "conan==2.8.1"
          conan remote add conancenter https://center2.conan.io --force
          CC=gcc-13 CXX=g++-13 conan install . \
            --profile:host "${{ inputs.conan-profile }}" \
            --profile:build "${{ inputs.conan-profile }}" \
            --lockfile "${{ inputs.conan-lockfile }}" \
            --output-folder=build/conan --build=missing
          CC=gcc-13 CXX=g++-13 cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake
          cmake --build build/release --parallel --target "${{ inputs.cmake-target }}"
      - name: Package and verify
        working-directory: ${{ inputs.project-directory }}
        env:
          FOUNDATION_CANDIDATE_REVISION: ${{ github.sha }}
        run: |
          cpp-foundation --manifest "${{ inputs.manifest }}" package --output-dir dist
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          cpp-foundation verify-release --archive "$archive" --checksum "$archive.sha256"
      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ inputs.project-directory }}/dist/*.tar.gz
      - name: Attest SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ inputs.project-directory }}/dist/*.tar.gz
          sbom-path: ${{ inputs.project-directory }}/dist/*-sbom.spdx.json
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.publish-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ inputs.project-directory }}"/dist/* --verify-tag --generate-notes
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpp-release-${{ github.run_id }}
          path: ${{ inputs.project-directory }}/dist/**
          if-no-files-found: error
