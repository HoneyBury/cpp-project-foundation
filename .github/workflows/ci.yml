name: Mainline / C++ Foundation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-foundation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpp-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CONAN_VENV: ${{ github.workspace }}/.venv/conan
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore Conan and compiler caches
        id: restore-caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .conan2
            .sccache
          key: foundation-linux-x64-${{ hashFiles('examples/hello-service/conanfile.py', 'examples/hello-service/conan/**') }}

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build sccache
          python3 scripts/ensure_conan.py --venv "$CONAN_VENV" --version 2.8.1
          export PATH="$CONAN_VENV/bin:$PATH"
          conan remote add conancenter https://center2.conan.io --force
          echo "$CONAN_VENV/bin" >> "$GITHUB_PATH"
          python3 -m pip install -e .

      - name: Validate foundation contract
        run: |
          cpp-foundation --manifest examples/hello-service/foundation.toml validate
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -v

      - name: Validate deployment configuration
        env:
          GRAFANA_ADMIN_USER: foundation-ci
          GRAFANA_ADMIN_PASSWORD: foundation-ci-placeholder
        run: docker compose -f examples/hello-service/deploy/docker-compose.yml config --quiet

      - name: Resolve dependency graph
        working-directory: examples/hello-service
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -euo pipefail
          conan install . \
            --profile:host conan/profiles/linux-gcc-x64 \
            --profile:build conan/profiles/linux-gcc-x64 \
            --lockfile conan/locks/linux-gcc-x64-release.lock \
            --output-folder=build/conan \
            --build=missing

      - name: Configure, build and test
        working-directory: examples/hello-service
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=ON \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER="$(command -v sccache)" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$(command -v sccache)"
          cmake --build build/release --parallel --target hello_service hello_service_tests
          ctest --test-dir build/release --output-on-failure --timeout 60
          build/release/bin/hello-service --check

      - name: Validate release and bounded P2 gates
        env:
          FOUNDATION_CANDIDATE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cpp-foundation --manifest examples/hello-service/foundation.toml package --output-dir dist
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          cpp-foundation verify-release --archive "$archive" --checksum "$archive.sha256"
          cpp-foundation --manifest examples/hello-service/foundation.toml soak \
            --duration-seconds 2 --interval-seconds 0.25 --output runtime/soak.json
          cpp-foundation --manifest examples/hello-service/foundation.toml perf \
            --repetitions 3 --minimum-ops-per-second 100000 \
            --maximum-p99-ms 1 --output runtime/perf.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpp-foundation-evidence-${{ github.run_id }}
          path: |
            dist/**
            runtime/**
          if-no-files-found: warn

      - name: Save caches
        if: always() && steps.restore-caches.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .conan2
            .sccache
          key: foundation-linux-x64-${{ hashFiles('examples/hello-service/conanfile.py', 'examples/hello-service/conan/**') }}
