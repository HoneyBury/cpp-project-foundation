name: Release / Package Attest and Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing immutable tag to publish or recover
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDATION_RELEASE_TAG: ${{ inputs.release-tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release-tag || github.ref }}
      - name: Resolve release context
        id: release-context
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          if [[ -n "$FOUNDATION_RELEASE_TAG" ]]; then
            tag_commit=$(git rev-list -n 1 "$FOUNDATION_RELEASE_TAG")
            test "$commit" = "$tag_commit"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches manifest
        if: env.FOUNDATION_RELEASE_TAG != ''
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("examples/hello-service/foundation.toml", "rb"))["project"]["version"])')
          test "$FOUNDATION_RELEASE_TAG" = "v$version"
      - name: Build release subject
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build
          python3 -m pip install "conan==2.8.1" -e .
          conan remote add conancenter https://center2.conan.io --force
          cd examples/hello-service
          CC=gcc-13 CXX=g++-13 conan install . \
            --profile:host conan/profiles/linux-gcc-x64 \
            --profile:build conan/profiles/linux-gcc-x64 \
            --lockfile conan/locks/linux-gcc-x64-release.lock \
            --output-folder=build/conan --build=missing
          CC=gcc-13 CXX=g++-13 cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake
          cmake --build build/release --parallel --target hello_service hello_service_tests
          ctest --test-dir build/release --output-on-failure
      - name: Package and independently verify
        id: package
        env:
          FOUNDATION_CANDIDATE_REVISION: ${{ steps.release-context.outputs.commit }}
        run: |
          cpp-foundation --manifest examples/hello-service/foundation.toml package --output-dir dist
          archive=$(find "$PWD/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)
          sbom="$archive-sbom.spdx.json"
          test -f "$archive" && test -f "$sbom"
          cpp-foundation verify-release --archive "$archive" --checksum "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"
      - name: Build and verify installable foundation wheel
        id: wheel
        run: |
          set -euo pipefail
          python3 -m pip wheel . --no-deps --wheel-dir dist
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          sha256sum "$wheel" > "$wheel.sha256"
          python3 -m venv runtime/release-wheel-venv
          runtime/release-wheel-venv/bin/pip install "$wheel"
          runtime/release-wheel-venv/bin/cpp-foundation init \
            --name release-wheel-smoke --version 1.0.0 \
            --output runtime/release-wheel-smoke
          runtime/release-wheel-venv/bin/cpp-foundation --manifest foundation.toml \
            doctor --root runtime/release-wheel-smoke
          runtime/release-wheel-venv/bin/cpp-foundation --manifest foundation.toml \
            template-diff --root runtime/release-wheel-smoke
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
      - name: Attest archive provenance
        if: env.FOUNDATION_RELEASE_TAG != '' && (github.event.repository.visibility == 'public' || vars.FOUNDATION_ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Attest archive SBOM
        if: env.FOUNDATION_RELEASE_TAG != '' && (github.event.repository.visibility == 'public' || vars.FOUNDATION_ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - name: Attest foundation wheel provenance
        if: env.FOUNDATION_RELEASE_TAG != '' && (github.event.repository.visibility == 'public' || vars.FOUNDATION_ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.wheel.outputs.wheel }}
      - name: Publish immutable GitHub release
        if: env.FOUNDATION_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$FOUNDATION_RELEASE_TAG" dist/* --verify-tag --generate-notes
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}
          path: dist/**
          if-no-files-found: error
