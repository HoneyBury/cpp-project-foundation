name: Quality / Format Static Analysis and Coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install native linters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 shellcheck
      - name: Setup pinned foundation quality tools
        uses: ./.github/actions/setup-foundation
        with:
          install-quality-tools: "true"
      - name: Run fast source-quality gate
        run: cpp-foundation quality --root . --mode fast

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2-quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install analysis toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 ninja-build
          python3 -m pip install "conan==2.8.1"
          conan remote add conancenter https://center2.conan.io --force
      - name: Resolve dependencies
        working-directory: examples/hello-service
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          conan install . \
            --profile:host conan/profiles/linux-clang-x64 \
            --profile:build conan/profiles/linux-clang-x64 \
            --lockfile conan/locks/linux-gcc-x64-release.lock \
            --output-folder=build/conan-quality --build=missing
      - name: Build with clang-tidy and warnings as errors
        working-directory: examples/hello-service
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build/quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18 \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan-quality/build/Release/generators/conan_toolchain.cmake
          cmake --build build/quality --parallel 2 \
            --target hello_service hello_service_tests

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install coverage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build
          python3 -m pip install "conan==2.8.1" "gcovr==8.6"
          conan remote add conancenter https://center2.conan.io --force
      - name: Resolve dependencies
        working-directory: examples/hello-service
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          conan install . \
            --profile:host conan/profiles/linux-gcc-x64 \
            --profile:build conan/profiles/linux-gcc-x64 \
            --lockfile conan/locks/linux-gcc-x64-release.lock \
            --output-folder=build/conan-coverage --build=missing
      - name: Build test and enforce coverage
        working-directory: examples/hello-service
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOUNDATION_ENABLE_COVERAGE=ON \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan-coverage/build/Release/generators/conan_toolchain.cmake
          cmake --build build/coverage --parallel 2 --target hello_service_tests
          ctest --test-dir build/coverage --output-on-failure
          mkdir -p ../../runtime/coverage
          gcovr --root . --filter 'src/' --exclude-unreachable-branches \
            --fail-under-line 90 --fail-under-branch 80 \
            --json-summary ../../runtime/coverage/summary.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}
          path: runtime/coverage/**
          if-no-files-found: error
