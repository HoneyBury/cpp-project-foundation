name: Reusable / C++ Security

on:
  workflow_call:
    inputs:
      project-directory:
        type: string
        default: "."
      conan-profile:
        type: string
        required: true
      conan-lockfile:
        type: string
        required: true
      test-target:
        type: string
        required: true
      fuzz-target:
        type: string
        required: true

permissions:
  contents: read

jobs:
  cpp-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2-security
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup foundation CLI
        uses: HoneyBury/cpp-project-foundation/.github/actions/setup-foundation@v0.4.0
      - name: Generate scan-ready Conan SBOM
        working-directory: ${{ inputs.project-directory }}
        run: |
          cpp-foundation dependency-sbom --lockfile "${{ inputs.conan-lockfile }}" \
            --output quality/conan-dependencies.spdx.json
      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --sbom=${{ inputs.project-directory }}/quality/conan-dependencies.spdx.json
      - name: Install security toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
          python3 -m pip install "conan==2.8.1"
          conan remote add conancenter https://center2.conan.io --force
      - name: Resolve dependencies
        working-directory: ${{ inputs.project-directory }}
        env:
          CC: clang
          CXX: clang++
        run: |
          conan install . --profile:host "${{ inputs.conan-profile }}" \
            --profile:build "${{ inputs.conan-profile }}" \
            --lockfile "${{ inputs.conan-lockfile }}" \
            --output-folder=build/conan-security --build=missing
      - name: ASan and UBSan
        working-directory: ${{ inputs.project-directory }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          CC=clang CXX=clang++ cmake -S . -B build/asan -G Ninja \
            -DENABLE_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan-security/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/asan --parallel 2 --target "${{ inputs.test-target }}"
          ctest --test-dir build/asan --output-on-failure --timeout 120
      - name: TSan
        working-directory: ${{ inputs.project-directory }}
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          CC=clang CXX=clang++ cmake -S . -B build/tsan -G Ninja \
            -DENABLE_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan-security/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/tsan --parallel 2 --target "${{ inputs.test-target }}"
          ctest --test-dir build/tsan --output-on-failure --timeout 120
      - name: Bounded fuzz smoke
        working-directory: ${{ inputs.project-directory }}
        run: |
          CC=clang CXX=clang++ cmake -S . -B build/fuzz -G Ninja \
            -DENABLE_TESTING=OFF -DENABLE_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan-security/build/Release/generators/conan_toolchain.cmake
          cmake --build build/fuzz --parallel 2 --target "${{ inputs.fuzz-target }}"
          mkdir -p runtime/fuzz
          "build/fuzz/bin/${{ inputs.fuzz-target }}" -max_total_time=60 -timeout=10 \
            -artifact_prefix=runtime/fuzz/
