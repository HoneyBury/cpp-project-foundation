name: Reusable / CMake Conan CI

on:
  workflow_call:
    inputs:
      project-directory:
        type: string
        default: "."
      conan-profile:
        type: string
        required: true
      conan-lockfile:
        type: string
        required: true
      cmake-target:
        type: string
        required: true
      test-target:
        type: string
        required: true
      conan-version:
        type: string
        default: "2.8.1"

permissions:
  contents: read

jobs:
  cpp-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build sccache
          python3 -m venv .venv/conan
          .venv/conan/bin/pip install "conan==${{ inputs.conan-version }}"
          echo "$GITHUB_WORKSPACE/.venv/conan/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: ${{ inputs.project-directory }}
        env:
          CC: gcc-13
          CXX: g++-13
          CONAN_HOME: ${{ github.workspace }}/.conan2
        run: |
          conan install . \
            --profile:host "${{ inputs.conan-profile }}" \
            --profile:build "${{ inputs.conan-profile }}" \
            --lockfile "${{ inputs.conan-lockfile }}" \
            --output-folder=build/conan --build=missing
      - name: Build and test
        working-directory: ${{ inputs.project-directory }}
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$(command -v sccache)"
          cmake --build build/release --parallel \
            --target "${{ inputs.cmake-target }}" "${{ inputs.test-target }}"
          ctest --test-dir build/release --output-on-failure --timeout 120
