name: Reusable / CMake Conan CI

on:
  workflow_call:
    inputs:
      project-directory:
        type: string
        default: "."
      conan-profile:
        type: string
        required: true
      clang-profile:
        type: string
        default: "conan/profiles/linux-clang-x64"
      conan-lockfile:
        type: string
        required: true
      cmake-target:
        type: string
        required: true
      test-target:
        type: string
        required: true
      conan-version:
        type: string
        default: "2.8.1"

permissions:
  contents: read

jobs:
  cpp-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cxx: g++-13
            profile-input: conan-profile
          - compiler: clang-18
            cxx: clang++-18
            profile-input: clang-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 gcc-13 g++-13 ninja-build sccache
          python3 -m venv .venv/conan
          .venv/conan/bin/pip install "conan==${{ inputs.conan-version }}"
          .venv/conan/bin/conan remote add conancenter https://center2.conan.io --force
          echo "$GITHUB_WORKSPACE/.venv/conan/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: ${{ inputs.project-directory }}
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [[ "${{ matrix.profile-input }}" == "clang-profile" ]]; then
            profile="${{ inputs.clang-profile }}"
          else
            profile="${{ inputs.conan-profile }}"
          fi
          conan install . \
            --profile:host "$profile" \
            --profile:build "$profile" \
            --lockfile "${{ inputs.conan-lockfile }}" \
            --output-folder=build/conan --build=missing
      - name: Build and test
        working-directory: ${{ inputs.project-directory }}
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTING=ON \
            -DFOUNDATION_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE=build/conan/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$(command -v sccache)"
          cmake --build build/release --parallel \
            --target "${{ inputs.cmake-target }}" "${{ inputs.test-target }}"
          ctest --test-dir build/release --output-on-failure --timeout 120
